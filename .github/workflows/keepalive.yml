name: Keep-alive Render

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -s --max-time 15 https://assistant-pme.onrender.com/api/health || true
          curl -s --max-time 15 https://kah-support.ch/api/health || true
